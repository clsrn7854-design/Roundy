# 로컬 개발 환경. 비밀번호와 API 키는 루트 .env에서 읽는다.
# 실행: docker compose up -d
# 포트는 127.0.0.1에만 연다. 같은 Wi-Fi의 다른 기기에서 DB에 접속하지 못하게 한다.
services:
  backend:
    build: ./backend
    # Windows 스마트 앱 컨트롤이 pip 패키지의 DLL을 막아서 백엔드는 컨테이너에서 실행한다.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      # 컨테이너 안에서는 localhost 대신 서비스 이름으로 DB에 접속한다.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      # Windows 폴더를 연결하면 파일 변경 알림이 오지 않아 주기적으로 확인한다.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 이 PC에는 Windows용 PostgreSQL 16이 5432를 쓰고 있어서 호스트 포트는 5433을 쓴다.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      # AuraDB Free 환경에 가깝게 메모리를 제한한다.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  neo4j-data:
  redis-data:
